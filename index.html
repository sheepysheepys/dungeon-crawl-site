<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dungeon Crawler - Home</title>
  </head>
  <body>
    <!-- Absolute paths: the directory-index URL has no trailing slash, so
         relative paths would resolve against the site root instead. -->
    <script src="/dungeon-crawl-site/js/config.js"></script>
    <script type="module">
      const { getUser, getRole, routeByRole, goto } = await import(
        `${window.APP_CONFIG.basePath}js/auth.js`
      );

      const user = await getUser();
      if (!user) {
        goto('login.html');
      } else {
        try {
          routeByRole(await getRole(user.id));
        } catch {
          goto('character.html');
        }
      }
    </script>
  </body>
</html>
